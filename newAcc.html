<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account</title>
     <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M532 71C539.6 77.1 544 86.3 544 96L544 400C544 444.2 501 480 448 480C395 480 352 444.2 352 400C352 355.8 395 320 448 320C459.2 320 470 321.6 480 324.6L480 207.9L256 257.7L256 464C256 508.2 213 544 160 544C107 544 64 508.2 64 464C64 419.8 107 384 160 384C171.2 384 182 385.6 192 388.6L192 160C192 145 202.4 132 217.1 128.8L505.1 64.8C514.6 62.7 524.5 65 532.1 71.1z"/></svg>'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

        <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/sign.css">

</head>

<body>



    <section class="section py-5">
        <div class=" main container text-center container py-5 w-50 border-3 border shadow rounded-3">
            <h2 class="text-main-color mb-4">Create a New Account</h2>
               <div id="alertBox" class="alert text-center d-none" role="alert"></div>

            <form id="NewAccForm">

                <div class="form-floating mb-3 col-md-7 mx-auto">
                    <input type="text" class="form-control" id="fullName" placeholder="Full Name" required>
                    <label class="text-muted" for="fullName">Full Name*</label>
                </div>


                <div class="form-floating mb-3 col-md-7 mx-auto">
                    <input type="text" class="form-control" id="userName" placeholder="Username" required>
                    <label class="text-muted" for="userName">Username*</label>
                </div>


                <div class="form-floating mb-3 col-md-7 mx-auto">
                    <input type="email" class="form-control" id="emailInput" placeholder="Email address" required>
                    <label class="text-muted" for="emailInput">Email*</label>
                </div>


                <div class="form-floating mb-3 col-md-7 mx-auto">
                    <input type="password" class="form-control" id="passwordInput" placeholder="Password" required>
                    <label class="text-muted" for="passwordInput">Password*</label>
                </div>


                <div class="form-floating mb-3 col-md-7 mx-auto">
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password"
                        required>
                    <label class="text-muted" for="confirmPassword">Confirm Password*</label>
                </div>


                <button type="submit" class="btn btn-dark py-1">Sign Up</button>

                <p class="mt-3">
                    <a href="index.html" class="text-decoration-none">Back to Sign In</a>
            </form>

    </section>

















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
        <script src="../js/signup.js"></script>
</body>

</html>
